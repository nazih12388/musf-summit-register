<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F2A4A" />
    <meta name="description" content="MUSF Union App - Official Students' Union Management System for Majlis Umariyya Wafy College" />
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/amu-crest-square.png" />
    <link rel="apple-touch-icon" href="/amu-crest-square.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('musf_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
    
    <title>MUSF Union App</title>
  </head>
  <body class="bg-[#F6F8FB] dark:bg-[#080E18]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
